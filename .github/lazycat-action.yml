version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/f1replaytiming.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: f1timing

build:
  run_buildscript: false

images:
  # tag 族含 2.1（两段）与 2.1.3（三段）：只跟三段式
  - id: f1timing
    target: service
    service: f1timing
    source: ghcr.io/adn8naiagent/f1replaytiming
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: F1 Replay Timing
    summary: "F1 直播/回放计时可视化"
